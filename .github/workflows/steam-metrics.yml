name: Generate Steam metrics

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STEAM_TOKEN: ${{ secrets.STEAM_TOKEN }}

    steps:
      - name: Generate Steam activity card
        if: ${{ env.STEAM_TOKEN != '' }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: steam-metrics.svg
          token: NOT_NEEDED
          base: ""
          config_timezone: Asia/Shanghai
          plugin_steam: yes
          plugin_steam_token: ${{ env.STEAM_TOKEN }}
          plugin_steam_user: "76561198975172386"
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_limit: 3
          plugin_steam_recent_games_limit: 3
          plugin_steam_achievements_limit: 2

      - name: Explain missing configuration
        if: ${{ env.STEAM_TOKEN == '' }}
        run: echo "Add the STEAM_TOKEN repository secret, then run this workflow again."
