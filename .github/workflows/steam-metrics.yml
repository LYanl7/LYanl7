name: Generate Steam metrics

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/steam-metrics.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate Steam profile card
        env:
          STEAM_TOKEN: ${{ secrets.STEAM_TOKEN }}
        run: python scripts/generate_steam_card.py --steam-id 76561198975172386 --output steam-metrics.svg

      - name: Commit generated card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-metrics.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Steam profile card [skip ci]"
          git push
